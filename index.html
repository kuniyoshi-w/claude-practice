<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="avatar">👤</div>
    <!-- ▼ ここをあなたの名前に書き換えてください -->
    <h1>花見 花子</h1>
    <p class="subtitle">はじめまして！よろしくお願いします。</p>
  </header>

  <main class="container">
    <section class="card">
      <h2><span class="icon">📍</span>出身地</h2>
      <!-- ▼ 出身地を書き換えてください -->
      <p>東京都 出身です。</p>
    </section>

    <section class="card">
      <h2><span class="icon">🎨</span>趣味</h2>
      <!-- ▼ 趣味を書き換え・追加してください -->
      <ul class="hobby-list">
        <li>読書</li>
        <li>カフェ巡り</li>
        <li>映画鑑賞</li>
        <li>プログラミング</li>
        <li>音楽鑑賞</li>
      </ul>
    </section>

    <section class="card card-wide">
      <h2><span class="icon">💻</span>このプログラムで作りたいシステム</h2>
      <!-- ▼ 作りたいシステムを書き換えてください -->
      <p>
        日々の業務を効率化できる「タスク管理システム」を作りたいです。
        チームで予定や進捗を共有し、締め切りが近いタスクを自動でお知らせしてくれる仕組みを目指しています。
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 山田 太郎</p>
  </footer>
</body>
</html>
